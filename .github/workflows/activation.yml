name: Acquire activation file
on:
  workflow_dispatch: {}
jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.62f1-base-3
    steps:
      - name: Generate manual activation file
        run: |
          unity-editor -batchmode -nographics -logFile - -createManualActivationFile || true
          ls -la
      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: "*.alf"
