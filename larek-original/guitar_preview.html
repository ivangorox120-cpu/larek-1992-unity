function makeTpl() {
  const t = gltf.scene.clone(true);
  t.traverse(o => { if (o.isMesh && o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace; });
  t.add(guitarProc(GINFO));
  return t;
}

function renderPanel(containerId, isFixed) {
  const w = 640, h = 540;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById(containerId).appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xc8c4bc);
  // Tile floor grid like in 6687.mp4
  const grid = new THREE.GridHelper(4, 12, 0x555555, 0x888888);
  scene.add(grid);
  const hemi = new THREE.HemisphereLight(0xfff6e8, 0x6a6055, 1.3);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(1, 3, 2);
  scene.add(dir);

  const camera = new THREE.PerspectiveCamera(68, w / h, 0.04, 50);
  camera.rotation.order = 'YXZ';
  const P = { x: 0, z: 0, h: 1.66, yaw: 0, pitch: isFixed ? -1.16 : -1.40 };
  camera.position.set(P.x, P.h, P.z);
  camera.rotation.set(P.pitch, P.yaw, 0);
  camera.updateMatrixWorld(true);

  const playerBody = makePlayerBody(std);
  window.__larekEquipped = { top: 'top_sport', legs: 'legs_watnik', feet: 'feet_boots' };
  playerBody.update({ x: P.x, y: 0, z: P.z, yaw: P.yaw, stepPh: 0, spd: 0, run: false, crouch: false, seated: false, lying: false, outfit: 'sport', guitar: true, dt: 0.016 });
  scene.add(playerBody.root);

  const wScene = new THREE.Scene();
  const wHemi = new THREE.HemisphereLight(0xfff6e8, 0x5a5045, 1.35);
  wScene.add(wHemi);
  const wDir = new THREE.DirectionalLight(0xffffff, 1.4);
  wDir.position.set(0.4, 1.5, 1.0);
  wScene.add(wDir);

  const wCam = camera.clone();
  wCam.position.set(0, 0, 0);
  wCam.quaternion.identity();

  const gPlay = new THREE.Group();
  gPlay.add(makeTpl());
  wScene.add(gPlay);
  const gHandR = makeRigHand(std, 1);
  const gHandL = makeRigHand(std, -1);
  wScene.add(gHandR);
  wScene.add(gHandL);

  const gHZ = new THREE.Vector3(), gHY = new THREE.Vector3(), gHX = new THREE.Vector3(), gHM = new THREE.Matrix4();
  function gHandOrient(hnd, wrist, back) {
    gHZ.copy(wrist).normalize();
    gHY.copy(back).addScaledVector(gHZ, -back.dot(gHZ)).normalize();
    gHX.crossVectors(gHY, gHZ);
    gHM.makeBasis(gHX, gHY, gHZ);
    hnd.quaternion.setFromRotationMatrix(gHM);
  }
  const gTmpV = new THREE.Vector3(), gTmpA = new THREE.Vector3(), gTmpB = new THREE.Vector3(), gTmpC = new THREE.Vector3();
  const gXv = new THREE.Vector3(), gYv = new THREE.Vector3(), gZv = new THREE.Vector3();
  function guitarLocal(x, y, z) { return gTmpV.set(x, y, z).applyQuaternion(gPlay.quaternion).add(gPlay.position); }

  const gBodyQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), P.yaw);
  const gCamQi = camera.quaternion.clone().invert();
  const toCam = (v) => v.applyQuaternion(gBodyQ).applyQuaternion(gCamQi);
  const gHole = new THREE.Vector3();

  const G_POSE_STRUM = { index: [.55, .75, .45, .02], middle: [.75, .95, .6, 0], ring: [.9, 1.05, .7, -.03], pinky: [1.0, 1.1, .75, -.06], thumb: [.35, .25, .2, .25] };
  const G_POSE_CHORD = { index: [.85, .95, .55, .10], middle: [.95, 1.05, .6, .02], ring: [1.0, 1.1, .65, -.05], pinky: [1.05, 1.15, .7, -.12], thumb: [.2, .1, .05, .55] };

  if (!isFixed) {
    // OLD CLAUDE POSE
    const G_YB = new THREE.Vector3(-.84, .20, -.48).normalize(),
          G_ZB = (() => { const z = new THREE.Vector3(.12, .96, .22); z.addScaledVector(G_YB, -z.dot(G_YB)); return z.normalize(); })(),
          G_XB = new THREE.Vector3().crossVectors(G_YB, G_ZB);
    const gGQb = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(G_XB, G_YB, G_ZB));
    gPlay.quaternion.copy(gCamQi).multiply(gBodyQ).multiply(gGQb);
    gHole.set(.10, -.55, -.02); toCam(gHole);
    gPlay.position.copy(gHole).sub(gTmpC.set(0, .195, 0).applyQuaternion(gPlay.quaternion));
    gYv.set(0, 1, 0).applyQuaternion(gPlay.quaternion); gZv.set(0, 0, 1).applyQuaternion(gPlay.quaternion);
    gHandR.position.copy(guitarLocal(.06, .235, .075));
    gHandOrient(gHandR, toCam(gTmpA.set(.85, -.32, .42)), toCam(gTmpB.set(-.22, .95, .08)));
    gHandR.pose(G_POSE_STRUM, null);
    const pL = guitarLocal(0, 0.72, .026); pL.add(toCam(gTmpA.set(.028, -.012, .032)));
    gHandL.position.copy(pL);
    gHandOrient(gHandL, toCam(gTmpA.set(-.18, -.50, .85)), toCam(gTmpB.set(-.32, .90, .22)));
    gHandL.pose(G_POSE_CHORD, null);
  } else {
    // NEW FIXED POSE MATCHING 6687.mp4
    // In body coords (+X right, +Y up, -Z forward):
    // G_YB (neck +Y): points left (-X), slightly up (+Y), and forward (-Z) -> (-0.82, +0.26, -0.51)
    // G_ZB (soundboard normal +Z): points forward (-Z) and tilted up (+Y) -> (-0.34, +0.52, -0.78)
    // G_XB (from 6th bass string -X down to 1st thin string +X): points down (-Y) and slightly forward!
    const G_YB = new THREE.Vector3(-.82, .26, -.51).normalize();
    const G_ZB = (() => { const z = new THREE.Vector3(-.34, .52, -.78); z.addScaledVector(G_YB, -z.dot(G_YB)); return z.normalize(); })();
    const G_XB = new THREE.Vector3().crossVectors(G_YB, G_ZB).normalize();
    const gGQb = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(G_XB, G_YB, G_ZB));
    gPlay.quaternion.copy(gCamQi).multiply(gBodyQ).multiply(gGQb);
    // Position soundhole/bridge area on the right side in front of torso/lap, just like 6687.mp4!
    gHole.set(.12, -.46, -.23); toCam(gHole);
    gPlay.position.copy(gHole).sub(gTmpC.set(0, .24, 0).applyQuaternion(gPlay.quaternion));
    gXv.set(1, 0, 0).applyQuaternion(gPlay.quaternion);
    gYv.set(0, 1, 0).applyQuaternion(gPlay.quaternion);
    gZv.set(0, 0, 1).applyQuaternion(gPlay.quaternion);

    // Right hand (strumming over the strings near the soundhole/bridge on the right):
    // Forearm (+Z_hand) goes toward right elbow (-gXv - gYv), palm (-Y_hand) faces the strings (-gZv), back (+Y_hand) faces outward (+gZv)
    gHandR.position.copy(guitarLocal(.01, .26, .038));
    const wristR = gTmpA.copy(gXv).multiplyScalar(-.62).addScaledVector(gYv, -.72).addScaledVector(gZv, -.18);
    const backR  = gTmpB.copy(gZv).multiplyScalar(.92).addScaledVector(gXv, -.25);
    gHandOrient(gHandR, wristR, backR);
    gHandR.pose(G_POSE_STRUM, null);

    // Left hand (cupping the neck from underneath, fingers curling over the fretboard from +X bottom edge to -X top edge):
    // Wrist (+Z_hand) goes down-and-back toward left elbow (+gXv - gZv - gYv)
    // Back of left hand (+Y_hand) faces outward-down (+gZv + gXv) so palm & curled fingertips (-Y_hand) press directly onto the fretboard (-gZv)!
    gHandL.position.copy(guitarLocal(.036, .68, .022));
    const wristL = gTmpA.copy(gXv).multiplyScalar(.78).addScaledVector(gZv, -.52).addScaledVector(gYv, -.22);
    const backL  = gTmpB.copy(gZv).multiplyScalar(.78).addScaledVector(gXv, .58);
    gHandOrient(gHandL, wristL, backL);
    gHandL.pose(G_POSE_CHORD, null);
  }

  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(wScene, wCam);
}

renderPanel('c1', false);
renderPanel('c2', true);
window.__renderDone = true;
</script>
